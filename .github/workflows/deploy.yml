name: Deploy
on:
  push:
    branches:
      - main
      - "copilot/**"
  pull_request:
    branches: main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read # Needed to clone the repository

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install step
        run: "npm install"

      - name: Build step
        run: "npm run build"

      - name: Upload to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: "weatherza"
          entrypoint: "https://deno.land/std@0.217.0/http/file_server.ts"
          root: "dist"
          # Token-based auth: bypasses GitHub environment protection rules.
          # Set DENO_DEPLOY_TOKEN in repository Settings → Secrets → Actions.
          # Get your token from: https://dash.deno.com/account#access-tokens
          token: ${{ secrets.DENO_DEPLOY_TOKEN }}
