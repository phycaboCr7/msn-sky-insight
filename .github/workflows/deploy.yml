name: Deploy
on:
  push:
    branches:
      - main
      - "copilot/**"
  pull_request:
    branches: main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Needed for OIDC auth with Deno Deploy (fallback)
      contents: read # Needed to clone the repository

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install step
        run: "npm install"

      - name: Build step
        run: "npm run build"

      - name: Upload to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: "weatherza"
          entrypoint: "https://deno.land/std@0.217.0/http/file_server.ts"
          root: "dist"
          # Use token-based auth to avoid environment protection approval requirement.
          # If DENO_DEPLOY_TOKEN is not set, falls back to OIDC (id-token: write).
          token: ${{ secrets.DENO_DEPLOY_TOKEN }}
