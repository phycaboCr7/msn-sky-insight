<!DOCTYPE html>
<html>
<head>
<meta name="google-adsense-account" content="ca-pub-6057406429223427">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather | Weatherza</title>

<meta name="robots" content="index, follow">

<script>
function getCity() {
  const path = window.location.pathname;
  const city = path.split("/").pop();
  return city;
}

document.addEventListener("DOMContentLoaded", () => {
  const city = getCity();

  document.title = "Weather in " + city + " | Weatherza";

  document.getElementById("cityTitle").innerText =
  "Weather in " + city;
});
</script>

<script type="application/ld+json">
{
 "@context":"https://schema.org",
 "@type":"WeatherForecast",
 "name":"Weather Forecast",
 "url":"https://weatherza.vercel.app",
 "provider":{
 "@type":"Organization",
 "name":"Weatherza"
 }
}
</script>

</head>

<body>

<h1 id="cityTitle"></h1>

</body>
</html>
